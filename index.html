<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weekly Outbreak Predictor</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 1rem;
      margin: 0;
      background-color: #f9f9f9;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background: #fff;
      padding: 1.5rem;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      margin-bottom: 1rem;
    }
    label {
      display: block;
      margin-top: 1rem;
      font-weight: bold;
    }
    input {
      width: 100%;
      padding: 0.5rem;
      margin-top: 0.5rem;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 0.75rem;
      margin-top: 1.5rem;
      background-color: #007BFF;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
    }
    .result {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 1.2rem;
      font-weight: bold;
    }
    @media (max-width: 600px) {
      body {
        padding: 0.5rem;
      }
      .container {
        padding: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Weekly Outbreak Predictor</h1>

    <label for="prevCases">Previous Week's Cases (I₍w−1₎):</label>
    <input type="number" id="prevCases" placeholder="Enter previous week's cases" />

    <label for="mobility">Mobility (M₍w₎, 0–100):</label>
    <input type="number" id="mobility" placeholder="Enter mobility score" />

    <label for="seasonalRisk">Seasonal Risk (S₍w₎, 0–100):</label>
    <input type="number" id="seasonalRisk" placeholder="Enter seasonal risk score" />

    <label for="healthResponse">Health Response (H₍w₎, 0–100):</label>
    <input type="number" id="healthResponse" placeholder="Enter health response score" />

    <label for="zeroFlag">Zero Flag (Z₍w₎, 0 or 1):</label>
    <input type="number" id="zeroFlag" placeholder="Enter zero flag" />

    <label for="population">Population Size (P):</label>
    <input type="number" id="population" placeholder="Enter city/municipality population" />

    <button onclick="calculatePrediction()">Predict Cases</button>

    <div class="result" id="result"></div>
  </div>

  <script>
    function calculatePrediction() {
      const prevCases = Number(document.getElementById('prevCases').value);
      const mobility = Number(document.getElementById('mobility').value);
      const seasonalRisk = Number(document.getElementById('seasonalRisk').value);
      const healthResponse = Number(document.getElementById('healthResponse').value);
      const zeroFlag = Number(document.getElementById('zeroFlag').value);
      const population = Number(document.getElementById('population').value);

      const zeroMultiplier = 1 - zeroFlag;
      const healthFactor = 1 - (healthResponse / 100);

      const basePrediction = (0.6 * prevCases) + (30 * (mobility / 100)) + (25 * (seasonalRisk / 100));
      const prediction = zeroMultiplier * basePrediction * healthFactor * (population / 100000);

      const rounded = Math.round(prediction);
      document.getElementById('result').textContent = `Predicted Cases: ${rounded}`;
    }
  </script>
</body>
</html>
